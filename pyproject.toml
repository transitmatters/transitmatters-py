[project]
name = "transitmatters"
version = "0.2.1"
description = "Official Python client for the TransitMatters Data Dashboard API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "attrs>=23.1",
    "python-dateutil>=2.8",
    "tzdata>=2023.3 ; sys_platform == 'win32'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/transitmatters/transitmatters-py"
"Upstream API" = "https://github.com/transitmatters/t-performance-dash"

[project.optional-dependencies]
pandas = ["pandas>=2.2"]

[dependency-groups]
test = ["pytest"]
# Runs the README, docstring, and notebook examples; see tox.toml.
examples = [
    "pytest",
    "pytest-markdown-docs",
    "nbmake",
    "matplotlib",
]
# Builds the docs site; see mkdocs.yml.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocstrings[python]>=1.0",
    "mkdocs-include-markdown-plugin>=7.2",
    "ruff",  # formats the signatures in the API reference
]
dev = [
    { include-group = "test" },
    { include-group = "examples" },
    { include-group = "docs" },
    "openapi-python-client",
    "ruff",
    "pyright>=1.1.414",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transitmatters"]

[tool.ruff]
extend-exclude = ["src/transitmatters/_generated"]

[tool.pyright]
# The oldest supported Python, so newer standard library APIs are flagged.
pythonVersion = "3.12"
