[project]
name = "transitmatters"
version = "0.1.0"
description = "Official Python client for the TransitMatters Data Dashboard API"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "attrs>=23.1",
    "python-dateutil>=2.8",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/transitmatters/transitmatters-py"
"Upstream API" = "https://github.com/transitmatters/t-performance-dash"

[dependency-groups]
dev = [
    "openapi-python-client",
    "ruff",
    "pytest",
    "pdoc>=16.0.0",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transitmatters"]

[tool.ruff]
extend-exclude = ["src/transitmatters/_generated"]
